<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" href="/images/ad_neighborhoods.png" />
		<link rel="apple-touch-icon" href="/images/ad_neighborhoods.png" />
		<link rel="shortcut icon" href="/images/ad_neighborhoods.png" />
		<!-- תגי Open Graph / Twitter מוגדרים פר-דף ברכיב <Seo> ($lib/components/Seo.svelte)
		     ולא כאן. שתי סיבות: (1) תג גלובלי מקדים את התג הפר-דפי ב-HTML, וכל שיתוף
		     היה מציג את כותרת דף הבית; (2) og:image חייב להיות כתובת מוחלטת — הנתיב
		     היחסי שהיה כאן פשוט לא נטען ע"י פייסבוק/וואטסאפ. -->
		<!-- preload ל-LCP assets: ה-poster של רקע הוידאו וה-thumbnail של YouTube מופיעים על המסך הראשון.
		     preconnect ל-i.ytimg.com מקצר את ה-handshake לתמונה הזו. -->
		<link rel="preload" as="image" href="/images/bg-poster.jpg" fetchpriority="high" />
		<link rel="preconnect" href="https://i.ytimg.com" crossorigin />
		<link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
		<!-- הגופן Heebo מתארח אצלנו (@font-face ב-app.css, הקבצים ב-static/fonts).
		     ה-preconnect וה-preload לגוגל-פונטס הוסרו: הם היו בקשה לשרת חיצוני עבור
		     גופן שכבר אינו בשימוש, ועוד handshake חוסם-רינדור ב-critical path. -->
		<!-- inline fallback - חל מיד לפני שכל CSS חיצוני נטען. כך נמנע הבזק של פונט סריף ברירת מחדל של הדפדפן. -->
		<style>
			html, body {
				font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
				background-color: #070b14;
			}
		</style>
		<!-- Google Analytics — נכס משותף לכל אתרי "יוצאים לחירות". ההפרדה בין
		     האתרים נעשית לפי hostName, ולכן אותו מזהה משמש את כולם. -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-YTEG7S0H9N"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() { dataLayer.push(arguments); }
			gtag('js', new Date());
			gtag('config', 'G-YTEG7S0H9N');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
